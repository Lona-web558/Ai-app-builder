<!-- public/index.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Builder AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
:root {
        --bg: #0b0f14;
        --panel: #121820;
        --line: #243040;
        --text: #dbe4ee;
        --dim: #7d8da1;
        --gold: #e6b84a;
        --cyan: #3dd6d0;
    }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk',system-ui,sans-serif;
        }
        .topbar {
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            padding-top: max(.5rem, env(safe-area-inset-top));
        }
        .brand {
            font-family: 'JetBrains Mono',monospace;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: .02em;
        }
        .log {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1rem;
        }
        .msg {
            margin-bottom: 1rem;
            max-width: 100%;
        }
        .msg.user {
            background: #17212c;
            border: 1px solid var(--line);
            border-left: 3px solid var(--cyan);
            border-radius: 6px;
            padding: .7rem .9rem;
            white-space: pre-wrap;
        }
        .msg.assistant {
            line-height: 1.6;
        }
        .msg.assistant p {
            max-width: 75ch;
        }
        .msg pre {
            background: #070a0e;
            border: 1px solid var(--line);
            border-radius: 0 0 6px 6px;
            padding: .9rem;
            margin: 0 0 1rem;
            overflow-x: auto;
        }
        .msg code {
            font-family: 'JetBrains Mono',monospace;
            font-size: .82rem;
            color: #cfe3f5;
        }
        .msg :not(pre) > code {
            background: #17212c;
            padding: .1rem .35rem;
            border-radius: 4px;
            color: var(--gold);
        }
        .codebar {
            display: flex;
            align-items: center;
            gap: .4rem;
            background: var(--panel);
            border: 1px solid var(--line);
            border-bottom: 0;
            border-radius: 6px 6px 0 0;
            padding: .3rem .6rem;
            margin-top: .5rem;
        }
        .codebar .name {
            font-family: 'JetBrains Mono',monospace;
            font-size: .78rem;
            color: var(--cyan);
            margin-right: auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .codebar button {
            background: none;
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 4px;
            font-size: .75rem;
            padding: .15rem .55rem;
        }
        .codebar button:hover, .codebar button:focus-visible {
            border-color: var(--gold);
            color: var(--gold);
            outline: none;
        }
        .composer {
            border-top: 1px solid var(--line);
            background: var(--panel);
            padding: .75rem 1rem max(.75rem, env(safe-area-inset-bottom));
        }
        .composer textarea {
            background: var(--bg);
            color: var(--text);
            border-color: var(--line);
            font-family: 'JetBrains Mono',monospace;
            font-size: .9rem;
            resize: none;
        }
        .composer textarea:focus {
            background: var(--bg);
            color: var(--text);
            border-color: var(--gold);
            box-shadow: none;
        }
        .btn-gold {
            background: var(--gold);
            border-color: var(--gold);
            color: #14100a;
            font-weight: 700;
        }
        .btn-gold:hover {
            background: #f0c765;
            border-color: #f0c765;
            color: #14100a;
        }
        .btn-ghost {
            border-color: var(--line);
            color: var(--text);
        }
        .btn-ghost:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .empty h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .empty p {
            color: var(--dim);
        }
        .example {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 6px;
            padding: .6rem .8rem;
            margin-bottom: .5rem;
        }
        .example:hover {
            border-color: var(--cyan);
        }
        .modal-content {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
        }
        .modal-header {
            border-color: var(--line);
        }
        #previewFrame {
            width: 100%;
            height: 70vh;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
        }
        @media (prefers-reduced-motion: no-preference) {
            .msg.assistant:last-child.live::after {
                content: '▍';
                color: var(--gold);
            }
        }
    </style>
</head>
<body>
    <header class="topbar d-flex align-items-center gap-2 px-3 pb-2">
        <span class="brand">App Builder AI</span>
        <span class="small d-none d-sm-inline" style="color:var(--dim)">Describe an app. Get working files.</span>
        <div class="ms-auto d-flex gap-2">
            <button id="codeBtn" class="btn btn-sm btn-ghost">Access code</button>
            <button id="newBtn" class="btn btn-sm btn-ghost">New chat</button>
        </div>
    </header>

    <main id="log" class="log"><div class="container-md" id="thread"></div>
    </main>

    <footer class="composer">
        <div class="container-md">
            <div class="input-group">
                <textarea id="input" rows="2" class="form-control" placeholder="e.g. A budget tracker with charts, Express backend and JSON storage"></textarea>
                <button id="send" class="btn btn-gold">Build</button>
            </div>
            <div class="small mt-1" style="color:var(--dim)">
                Enter to send, Shift+Enter for a new line.
            </div>
        </div>
    </footer>

    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-6">Live preview</h2><button class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        const thread = $('#thread'), log = $('#log'), input = $('#input'), sendBtn = $('#send');
        const EXAMPLES = [
            'A single-file expense tracker with Bootstrap and localStorage',
            'A Node.js + Express REST API for a to-do list with JSON file storage and a Bootstrap front end',
            'A landing page for a tutoring business, responsive, with a contact form'
        ];
        let messages = read('chat', []), busy = false, err = '';

        function read(k, d) {
            try {
                return JSON.parse(localStorage.getItem(k)) ?? d;
            } catch {
                return d;
            }
        }
        function persist() {
            try {
                localStorage.setItem('chat', JSON.stringify(messages));
            } catch {}
        }
        const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot; '}[c]));

            function guessName(text, lang) {
                const m = text.split('\n')[0].match(/(?:\/\/|#|<!--|\/\*)\s*([\w\-./]+\.\w{1,5})/);
                if (m) return m[1];
                return ({
                    html: 'index.html', css: 'style.css', javascript: 'script.js', js: 'script.js', json: 'data.json', bash: 'commands.sh'
                })[lang] || 'file.txt';
            }

            function enhance(el) {
                el.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code'); if (!code) return;
                    const text = code.textContent;
                    const lang = (code.className.match(/language-(\w+)/) || [])[1] || '';
                    const name = guessName(text, lang);
                    const bar = document.createElement('div'); bar.className = 'codebar';
                    bar.innerHTML = `<span class="name">${esc(name)}</span><button data-a="copy">Copy</button><button data-a="dl">Download</button>` +
                    (lang === 'html' ? '<button data-a="prev">Preview</button>': '');
                    bar.addEventListener('click', e => {
                        const a = e.target.dataset.a; if (!a) return;
                        if (a === 'copy') {
                            navigator.clipboard.writeText(text).then(() => {
                                e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1200);
                            });
                        }
                        if (a === 'dl') {
                            const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([text])); l.download = name.split('/').pop(); l.click(); URL.revokeObjectURL(l.href);
                        }
                        if (a === 'prev') {
                            $('#previewFrame').srcdoc = text; bootstrap.Modal.getOrCreateInstance('#previewModal').show();
                        }
                    });
                    pre.before(bar);
                });
            }

            function node(m, live) {
                const d = document.createElement('div');
                d.className = 'msg ' + m.role + (live ? ' live': '');
                if (m.role === 'user') d.textContent = m.content;
                else {
                    d.innerHTML = DOMPurify.sanitize(marked.parse(m.content || '')); enhance(d);
                }
                return d;
            }

            function render() {
                thread.innerHTML = '';
                if (!messages.length) {
                    thread.innerHTML = '<div class="empty py-4"><h1>What should we build?</h1><p>Pick a starting point or describe your own app.</p></div>';
                    EXAMPLES.forEach(t => {
                        const b = document.createElement('button'); b.className = 'example'; b.textContent = t; b.onclick = () => send(t); thread.appendChild(b);
                    });
                } else {
                    messages.forEach((m, i) => thread.appendChild(node(m, busy && i === messages.length - 1)));
                }
                if (err) {
                    const a = document.createElement('div'); a.className = 'alert alert-danger'; a.textContent = err; thread.appendChild(a);
                }
                log.scrollTop = log.scrollHeight;
            }

            let raf = 0;
            function updateLast() {
                if (raf) return;
                raf = requestAnimationFrame(() => {
                    raf = 0;
                    const last = thread.lastElementChild;
                    if (last && last.classList.contains('assistant')) last.replaceWith(node(messages.at(-1), true));
                    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
                    if (nearBottom) log.scrollTop = log.scrollHeight;
                });
            }

            function askCode() {
                const c = prompt('Enter your access code',
                    localStorage.getItem('code') || '');
                if (c !== null) localStorage.setItem('code', c.trim());
            }

            async function send(text) {
                text = (text || '').trim();
                if (busy || !text) return;
                busy = true; err = ''; sendBtn.disabled = true; input.value = '';
                messages.push({
                    role: 'user', content: text
                }, {
                    role: 'assistant', content: ''
                });
                render();
                try {
                    const r = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json', 'x-access-code': localStorage.getItem('code') || ''
                        },
                        body: JSON.stringify({
                            messages: messages.slice(0, -1)
                        })
                    });
                    if (!r.ok) {
                        const e = await r.json().catch(() => ({})); throw new Error(e.error || `Request failed (${r.status})`);
                    }
                    const reader = r.body.getReader(),
                    dec = new TextDecoder(),
                    last = messages.at(-1);
                    while (true) {
                        const {
                            done,
                            value
                        } = await reader.read();
                        if (done) break;
                        last.content += dec.decode(value, {
                            stream: true
                        });
                        updateLast();
                    }
                    if (!last.content.trim()) throw new Error('The AI returned an empty reply. Try again.');
                } catch (e) {
                    messages.splice(-2, 2); // drop the failed turn so history stays valid
                    input.value = text; err = e.message;
                    if (/access code/i.test(e.message)) askCode();
                } finally {
                    busy = false; sendBtn.disabled = false; persist(); render();
                }
            }

            sendBtn.onclick = () => send(input.value);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); send(input.value);
                }
            });
            $('#newBtn').onclick = () => {
                if (busy) return; if (!messages.length || confirm('Start a new chat? This clears the current one.')) {
                    messages = []; err = ''; persist(); render();
                }
            };
            $('#codeBtn').onclick = askCode;
            render();
        </script>
        </body>
    </html>
